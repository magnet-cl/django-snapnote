[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-snapnote"
dynamic = ["version"]
description = "Report problems from any page of a Django site: screenshot, annotations and a ticket list."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["Django>=4.2", "Pillow>=9.0"]
classifiers = [
  "Environment :: Web Environment",
  "Framework :: Django",
  "Framework :: Django :: 4.2",
  "Framework :: Django :: 5.0",
  "Framework :: Django :: 5.1",
  "Framework :: Django :: 5.2",
  "Framework :: Django :: 6.1",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]

[tool.hatch.version]
path = "src/snapnote/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/snapnote"]
artifacts = ["src/snapnote/static/**", "src/snapnote/locale/**/*.mo"]

[tool.hatch.build.targets.sdist]
include = ["src/snapnote", "README.md", "CHANGELOG.md", "LICENSE", "frontend", "tests"]
exclude = ["frontend/node_modules"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.testproject.settings"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
